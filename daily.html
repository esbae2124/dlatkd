<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일일 15제 훈련소 🔥</title>

    <!-- 🌟 스마트폰 홈 화면 추가 시 나타날 불꽃 아이콘 🌟 -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn-icons-png.flaticon.com/512/785/785116.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://cdn-icons-png.flaticon.com/512/785/785116.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://cdn-icons-png.flaticon.com/512/785/785116.png">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .header { text-align: center; margin-bottom: 20px; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 10px; height: 12px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #28a745; width: 0%; transition: width 0.3s ease; }
        
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; min-height: 300px; display: flex; flex-direction: column; }
        .badge { background: #e8f0fe; color: #495057; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        
        .question { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .answer-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; color: #155724; display: none; flex-grow: 1; overflow-y: auto; margin-bottom: 20px; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-show { background-color: #6c757d; color: white; }
        .btn-next { background-color: #007bff; color: white; display: none; margin-top: 10px; }
        .btn-finish { background-color: #28a745; color: white; display: none; margin-top: 10px; }
        
        .loading { text-align: center; font-weight: bold; color: #666; margin-top: 50px; }
        
        /* 마크다운 테이블 스타일 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ced4da; padding: 8px; text-align: left; }
        th { background-color: #e9ecef; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔥 듀오링고식 일일 15제</h2>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="progressText" style="font-size: 14px; color: #666; font-weight: bold;">로딩 중...</div>
    </div>

    <div id="loading" class="loading">🔄 구글 시트에서 오늘의 문제를 섞어오는 중입니다...</div>

    <div id="quizContainer" style="display: none;">
        <div class="card">
            <div><span class="badge" id="subjectBadge">과목명</span></div>
            <div class="question" id="questionBox">질문 내용</div>
            <div class="answer-box" id="answerBox">정답 내용</div>
            
            <div style="margin-top: auto;">
                <button class="btn btn-show" id="btnShow" onclick="showAnswer()">💡 정답 확인하기</button>
                <button class="btn btn-next" id="btnNext" onclick="nextQuestion()">다음 문제 ➡️</button>
                <button class="btn btn-finish" id="btnFinish" onclick="finishQuiz()">🎉 훈련 완료 (메인으로)</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzM9hRVIOnJm7wIR1SACRfMLxZMEgQ5bXYXCSVGhBE_mEFn32t9Zv825KjIxxsuH3EP9Q/exec";
        let dailyProblems = [];
        let currentIndex = 0;
        const TOTAL_QUESTIONS = 15;

        document.addEventListener("DOMContentLoaded", () => {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if(data.problems && data.problems.length > 0) {
                        let shuffled = data.problems.sort(() => 0.5 - Math.random());
                        dailyProblems = shuffled.slice(0, TOTAL_QUESTIONS);
                        startQuiz();
                    } else {
                        document.getElementById('loading').innerText = "문제가 없습니다. 시트를 확인해주세요.";
                    }
                })
                .catch(err => {
                    document.getElementById('loading').innerText = "데이터를 불러오는 데 실패했습니다.";
                });
        });

        function startQuiz() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quizContainer').style.display = 'block';
            updateUI();
        }

        function updateUI() {
            const p = dailyProblems[currentIndex];
            
            document.getElementById('subjectBadge').innerText = `${p.subject} (${p.year})`;
            document.getElementById('questionBox').innerHTML = marked.parse(p.question);
            document.getElementById('answerBox').innerHTML = marked.parse(p.answer);
            
            document.getElementById('answerBox').style.display = 'none';
            document.getElementById('btnShow').style.display = 'block';
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('btnFinish').style.display = 'none';
            
            const progressPercent = ((currentIndex) / TOTAL_QUESTIONS) * 100;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').innerText = `진행률: ${currentIndex + 1} / ${TOTAL_QUESTIONS}`;
        }

        function showAnswer() {
            document.getElementById('answerBox').style.display = 'block';
            document.getElementById('btnShow').style.display = 'none';
            
            if (currentIndex === TOTAL_QUESTIONS - 1) {
                document.getElementById('btnFinish').style.display = 'block';
            } else {
                document.getElementById('btnNext').style.display = 'block';
            }
        }

        function nextQuestion() {
            currentIndex++;
            updateUI();
        }

        function finishQuiz() {
            document.getElementById('progressFill').style.width = `100%`;
            alert("🎉 고생하셨습니다! 오늘의 15제 훈련을 완벽하게 클리어했습니다! 🎉");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
